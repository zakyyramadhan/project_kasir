<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kasir Seblak</title>
<style>
  :root{
    --bg:#f6f4f0; --panel:#ffffff; --panel2:#f1eee6; --line:#e7e1d5;
    --txt:#221c12; --muted:#8b8271; --accent:#e8590c; --accent2:#ffb347; --hot:#d9260c; --green:#16a34a;
    --radius:14px; --shadow:0 10px 30px rgba(34,22,18,.10); --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:center;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
  .inner{width:100%;max-width:var(--maxw);display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-size:20px;box-shadow:0 4px 16px rgba(232,89,12,.28)}
  .brand h1{font-size:18px;font-weight:800}
  .brand small{display:block;color:var(--muted);font-size:11px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,89,12,.3)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:24px 26px}

  /* Auth screen */
  #authView{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
  .auth-card{width:360px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow)}
  .auth-card .logo{margin:0 auto 18px;width:56px;height:56px;font-size:28px}
  .auth-card h2{text-align:center;margin-bottom:4px;font-size:20px}
  .auth-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:14px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent2)}
  .auth-error{color:var(--hot);font-size:12px;min-height:16px;margin-top:6px}
  .auth-card .btn.primary{width:100%;padding:13px;font-size:15px;margin-top:6px}

  /* App (admin) view */
  #app-view{display:none}
  .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;font-weight:600;padding:10px 16px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat b{font-size:18px;font-weight:800}
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  .table-wrap table{border:none}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  .toolbar h2{font-size:16px;color:var(--muted);font-weight:600;margin-right:auto}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
  .search input{background:none;border:none;outline:none;color:var(--txt);font-size:13px;width:220px}
  .search input::placeholder{color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{padding:12px 16px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px;background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  td.money{font-weight:600}
  .badge{padding:3px 9px;border-radius:999px;font-size:11px}
  .badge.on{background:rgba(74,222,128,.15);color:var(--green)}
  .badge.off{background:rgba(255,45,26,.15);color:var(--hot)}
  .row-actions{display:flex;gap:6px}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--txt);font-size:14px}
  .icon-btn:hover{border-color:var(--accent2)}
  .icon-btn.del:hover{color:var(--hot);border-color:var(--hot)}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}

  /* Modal (add/edit) */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:100;backdrop-filter:blur(3px)}
  .modal-bg.show{display:grid}
  .modal{width:430px;max-width:94vw;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h3{font-size:17px;margin-bottom:18px}
  .modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal .actions{display:flex;gap:10px;margin-top:20px}
  .modal .actions .btn{flex:1;padding:12px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);opacity:0;background:#2b1a10;border:1px solid var(--accent2);color:var(--txt);padding:13px 20px;border-radius:12px;font-size:14px;transition:.3s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="logo">🌶️</div>
    <h2>Admin Kasir Seblak</h2>
    <p>Masuk untuk mengelola menu</p>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="email@anda.com"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <div class="auth-error" id="authError"></div>
    <button class="btn primary" id="loginBtn">Masuk</button>
  </div>
</div>

<!-- ============ APP (ADMIN) ============ -->
<div id="app-view">
  <header>
    <div class="inner">
      <div class="brand">
        <div class="logo">🌶️</div>
        <div><h1>Admin Kasir Seblak</h1><small>Kelola menu & data</small></div>
      </div>
      <div class="top-actions">
        <span id="adminEmail" style="font-size:12px;color:var(--muted)"></span>
        <button class="btn ghost" onclick="location.href='index.html'">⟵ Kasir</button>
        <button class="btn ghost" id="logoutBtn">Keluar</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" id="tabProducts" onclick="switchTab('products')">🛍️ Produk</button>
      <button class="tab" id="tabHistory" onclick="switchTab('history')">📊 Riwayat Penjualan</button>
    </div>

    <!-- PRODUCTS PANEL -->
    <div id="panelProducts">
      <div class="toolbar">
        <h2>Menu Produk</h2>
        <div class="search">🔍<input id="q" placeholder="Cari produk…"></div>
        <button class="btn ghost" onclick="openUserModal()">👥 Tambah User</button>
        <button class="btn primary" onclick="openModal()">+ Tambah Produk</button>
      </div>
      <table>
        <thead><tr>
          <th>Emoji</th><th>Nama</th><th>SKU</th><th>Harga</th><th>Modal</th><th>Stock</th><th>Status</th><th>Aksi</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- SALES HISTORY PANEL -->
    <div id="panelHistory" style="display:none">
      <div class="toolbar">
        <h2>Riwayat Penjualan</h2>
        <div class="search">📅<input id="dateFilter" type="date"></div>
        <button class="btn ghost" onclick="loadHistory()">↻ Muat</button>
      </div>
      <div class="stats">
        <div class="stat"><span>Penjualan</span><b id="statCount">0</b></div>
        <div class="stat"><span>Revenue</span><b id="statRevenue">Rp 0</b></div>
        <div class="stat"><span>Item Terjual</span><b id="statItems">0</b></div>
        <div class="stat"><span>Estimasi Profit</span><b id="statProfit" style="color:var(--green)">Rp 0</b></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Invoice</th><th>Antri</th><th>Waktu</th><th>Metode</th><th>Jumlah Item</th><th>Total</th>
          </tr></thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL ADD/EDIT ============ -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Tambah Produk</h2>
    <div class="grid2">
      <div class="field"><label>Nama</label><input id="fName"></div>
      <div class="field"><label>SKU</label><input id="fSku"></div>
      <div class="field"><label>Harga Jual</label><input id="fSell" type="number"></div>
      <div class="field"><label>Harga Modal</label><input id="fCost" type="number"></div>
      <div class="field"><label>Stock</label><input id="fStock" type="number"></div>
      <div class="field"><label>Emoji</label><select id="fEmoji">
        <option value="">— pilih —</option>
        <option value="🍜">🍜 Mie</option>
        <option value="🌶️">🌶️ Seblak/Pedas</option>
        <option value="🍲">🍲 Seblak Original</option>
        <option value="🍗">🍗 Ayam/Ceker</option>
        <option value="🧀">🧀 Keju</option>
        <option value="🍢">🍢 Cilok/Bakso</option>
        <option value="🍤">🍤 Udang/Seafood</option>
        <option value="🥚">🥚 Telur</option>
        <option value="🧋">🧋 Es Teh/Minuman</option>
        <option value="🥤">🥤 Jus/Soda</option>
        <option value="🍚">🍚 Nasi</option>
        <option value="🍞">🍞 Roti/Camilan</option>
        <option value="🍟">🍟 Gorengan</option>
        <option value="🌮">🌮 Lainnya</option>
      </select></div>
    </div>
    <div class="field"><label><input type="checkbox" id="fActive" checked> Aktif</label></div>
    <input type="hidden" id="fId">
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn primary" id="saveBtn">Simpan</button>
    </div>
  </div>
</div>

<!-- ============ MODAL ADD USER ============ -->
<div class="modal-bg" id="userModalBg">
  <div class="modal">
    <h2>Tambah User</h2>
    <div class="grid2">
      <div class="field"><label>Nama</label><input id="uName" placeholder="Nama kasir"></div>
      <div class="field"><label>Email</label><input id="uEmail" type="email" placeholder="user@email.com"></div>
    </div>
    <div class="field"><label>Password</label><input id="uPass" type="password" placeholder="min. 6 karakter"></div>
    <div class="actions">
      <button class="btn ghost" onclick="closeUserModal()">Batal</button>
      <button class="btn primary" id="saveUserBtn">Buat User</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://okkwtpscikwiumoophsa.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ra3d0cHNjaWt3aXVtb29waHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNTM5ODQsImV4cCI6MjA5NzkyOTk4NH0.OZrvoeTT4XAtp6eubzSdzVKL2lpN2o6sp0-4vgT840I';

// Guard: supabase-js must have loaded from CDN, else show a clear error.
if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
  document.querySelector('.auth-error').textContent =
    'Gagal memuat pustaka supabase-js (CDN tidak terjangkau). Periksa koneksi internet Anda.';
  document.getElementById('loginBtn').disabled = true;
  throw new Error('supabase-js library failed to load from CDN');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let products = [];
let editId = null;

const fmt = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const toast = (m,err)=>{const t=document.getElementById('toast');t.textContent=m;t.style.borderColor=err?'var(--hot)':'var(--accent2)';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);};

/* ---------- AUTH ---------- */
async function checkSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ showApp(session.user.email); } else { showAuth(); }
}
async function login(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass =document.getElementById('loginPass').value;
  const err=document.getElementById('authError');
  err.textContent='';
  if(!email||!pass){err.textContent='Email & password wajib diisi';return;}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){err.textContent=error.message;return;}
  showApp(email);
}
function logout(){ sb.auth.signOut(); showAuth(); }
function showApp(email){document.getElementById('auth-screen').style.display='none';document.getElementById('app-view').style.display='block';document.getElementById('adminEmail').textContent=email;loadProducts();}
function showAuth(){document.getElementById('auth-screen').style.display='grid';document.getElementById('app-view').style.display='none';}

document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('logoutBtn').addEventListener('click',logout);
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('q').addEventListener('input',render);

/* ---------- DATA ---------- */
function emojiOf(n){n=(n||'').toLowerCase();if(n.includes('seblak'))return '🌶️';if(n.includes('mie')||n.includes('indomie'))return '🍜';if(n.includes('teh')||n.includes('es')||n.includes('jus'))return '🧋';if(n.includes('cilok'))return '🍢';if(n.includes('ceker'))return '🍗';if(n.includes('keju'))return '🧀';return '🍽️';}

async function loadProducts(){
  const {data,error}=await sb.from('products').select('*').order('created_at');
  if(error){toast('Gagal muat: '+error.message,true);return;}
  products=data;
  render();
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const list=products.filter(p=>!q||(p.name||'').toLowerCase().includes(q));
  const tb=document.getElementById('tbody');
  if(!list.length){tb.innerHTML='<tr><td colspan="8" class="empty">Tidak ada produk</td></tr>';return;}
  tb.innerHTML=list.map(p=>`
    <tr>
      <td style="font-size:20px">${p.emoji||emojiOf(p.name)}</td>
      <td>${p.name}</td>
      <td style="color:var(--muted)">${p.sku||'-'}</td>
      <td class="money">${fmt(p.sale_price)}</td>
      <td class="money" style="color:var(--muted)">${fmt(p.cost_price||0)}</td>
      <td>${p.stock}</td>
      <td><span class="badge ${p.is_active?'on':'off'}">${p.is_active?'Aktif':'Nonaktif'}</span></td>
      <td class="row-actions">
        <button class="icon-btn" onclick="openModal('${p.id}')">✏️</button>
        <button class="icon-btn" onclick="toggleActive('${p.id}')">${p.is_active?'⏸️':'▶️'}</button>
        <button class="icon-btn del" onclick="removeProduct('${p.id}')">🗑️</button>
      </td>
    </tr>`).join('');
}

/* ---------- CRUD ---------- */
function openModal(id){
  editId=id||null;
  const f=document.getElementById('f'+(id?'Name':'Name'));
  if(id){
    const p=products.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent='Edit Produk';
    document.getElementById('fId').value=id;
    document.getElementById('fName').value=p.name;
    document.getElementById('fSku').value=p.sku||'';
    document.getElementById('fSell').value=p.sale_price;
    document.getElementById('fCost').value=p.cost_price||0;
    document.getElementById('fStock').value=p.stock;
    document.getElementById('fEmoji').value=p.emoji||'';
    document.getElementById('fActive').checked=p.is_active;
  }else{
    document.getElementById('modalTitle').textContent='Tambah Produk';
    ['fId','fName','fSku','fSell','fCost','fStock','fEmoji'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('fActive').checked=true;
  }
  document.getElementById('modalBg').classList.add('show');
}
async function saveProduct(){
  const name=document.getElementById('fName').value.trim();
  if(!name){toast('Nama wajib diisi',true);return;}
  const rec={
    name,
    sku:document.getElementById('fSku').value.trim()||null,
    sale_price:+document.getElementById('fSell').value||0,
    cost_price:+document.getElementById('fCost').value||0,
    stock:+document.getElementById('fStock').value||0,
    emoji:document.getElementById('fEmoji').value||'',
    is_active:document.getElementById('fActive').checked
  };
  let error;
  if(editId){ ({error}=await sb.from('products').update(rec).eq('id',editId)); }
  else{ ({error}=await sb.from('products').insert(rec)); }
  if(error){toast('Gagal: '+error.message,true);return;}
  toast('Tersimpan ✓');closeModal();loadProducts();
}
async function toggleActive(id){
  const p=products.find(x=>x.id===id);
  const {error}=await sb.from('products').update({is_active:!p.is_active}).eq('id',id);
  if(error){toast('Gagal: '+error.message,true);return;}
  loadProducts();
}
async function removeProduct(id){
  if(!confirm('Hapus produk ini?'))return;
  const {error}=await sb.from('products').delete().eq('id',id);
  if(error){toast('Gagal: '+error.message,true);return;}
  toast('Terhapus');loadProducts();
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('saveBtn').addEventListener('click',saveProduct);

/* ---------- ADD USER (secure RPC) ---------- */
function openUserModal(){
  ['uName','uEmail','uPass'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('userModalBg').classList.add('show');
  document.getElementById('uEmail').focus();
}
function closeUserModal(){document.getElementById('userModalBg').classList.remove('show');}
async function saveUser(){
  const name=document.getElementById('uName').value.trim();
  const email=document.getElementById('uEmail').value.trim();
  const pass =document.getElementById('uPass').value;
  if(!email){toast('Email wajib diisi',true);return;}
  if(pass.length<6){toast('Password min. 6 karakter',true);return;}
  const btn=document.getElementById('saveUserBtn');
  btn.disabled=true; btn.textContent='Membuat…';
  const {data,error}=await sb.rpc('admin_create_user',{p_email:email,p_password:pass,p_name:name||null});
  btn.disabled=false; btn.textContent='Buat User';
  if(error){toast('Gagal: '+error.message,true);return;}
  if(data && data.success===false){toast('Gagal: '+(data.error||'unknown'),true);return;}
  toast('User dibuat ✓');closeUserModal();
}
document.getElementById('userModalBg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeUserModal();});
document.getElementById('saveUserBtn').addEventListener('click',saveUser);

/* ---------- SALES HISTORY / DAILY REPORT ---------- */
function switchTab(t){
  const p = t==='products';
  document.getElementById('panelProducts').style.display = p?'block':'none';
  document.getElementById('panelHistory').style.display = p?'none':'block';
  document.getElementById('tabProducts').classList.toggle('active',p);
  document.getElementById('tabHistory').classList.toggle('active',!p);
  if(!p) loadHistory();
}
async function loadHistory(){
  const df=document.getElementById('dateFilter');
  if(!df.value) df.value = new Date().toISOString().slice(0,10);
  const date=df.value;
  const {data:rows,error}=await sb.from('sales')
    .select('id,invoice_no,queue_no,created_at,total,payment_method,status,sale_items(product_id,qty,price,products(cost_price))')
    .eq('sale_date',date).order('queue_no',{ascending:true});
  if(error){toast('Gagal muat riwayat: '+error.message,true);return;}
  const tb=document.getElementById('histBody');
  if(!rows||!rows.length){
    tb.innerHTML='<tr><td colspan="6" class="empty">Tidak ada penjualan pada tanggal ini</td></tr>';
    document.getElementById('statCount').textContent='0';
    document.getElementById('statRevenue').textContent='Rp 0';
    document.getElementById('statItems').textContent='0';
    document.getElementById('statProfit').textContent='Rp 0';
    return;
  }
  let rev=0, items=0, profit=0;
  tb.innerHTML=rows.map(s=>{
    rev += +s.total;
    const it = s.sale_items||[];
    const cnt = it.reduce((a,i)=>a+i.qty,0);
    items += cnt;
    profit += it.reduce((a,i)=>a + (i.qty*(+i.price - +(i.products&&i.products.cost_price||0))),0);
    return `<tr>
      <td style="font-weight:700">${s.invoice_no}</td>
      <td>#${s.queue_no}</td>
      <td>${new Date(s.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</td>
      <td>${s.payment_method}</td>
      <td>${cnt} item</td>
      <td class="money">${fmt(s.total)}</td>
    </tr>`;
  }).join('');
  document.getElementById('statCount').textContent = rows.length;
  document.getElementById('statRevenue').textContent = fmt(rev);
  document.getElementById('statItems').textContent = items;
